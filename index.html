/* ===== ONDWAY — FLOW design tokens ===== */
:root{
  --color-primary:#102A43;--color-primary-hover:#183B56;--color-primary-active:#0B2033;
  --color-secondary:#00B8B0;--color-secondary-dark:#007F7A;--color-secondary-light:#DDF5F2;
  --color-support:#183B56;--color-support-light:#E6EFF5;
  --color-background:#FFFFFF;--color-background-soft:#F4F7FA;--color-surface:#FFFFFF;--color-surface-hover:#EDF2F6;--color-surface-active:#E5ECF2;
  --color-text-primary:#102A43;--color-text-secondary:#526171;--color-text-muted:#68788A;--color-text-inverse:#FFFFFF;--color-text-link:#007F7A;--color-text-disabled:#7A8794;
  --color-border:#D7E0E8;--color-border-strong:#AAB9C7;--color-border-focus:#007F7A;
  --color-success:#16794B;--color-success-bg:#E8F5ED;--color-warning:#8A5700;--color-warning-bg:#FFF3D9;
  --color-danger:#B42318;--color-danger-bg:#FDECEA;--color-unavailable:#596579;--color-unavailable-bg:#EDF0F4;--color-info:#2367A5;--color-info-bg:#EAF2FB;
  --font-heading:'Manrope',sans-serif;--font-body:'Inter',sans-serif;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --shadow-sm:0 1px 3px rgba(16,42,67,.08);--shadow-md:0 4px 12px rgba(16,42,67,.10);--shadow-lg:0 8px 24px rgba(16,42,67,.12);
  --button-primary-bg:#007F7A;--button-primary-hover:#006B67;--button-primary-active:#005954;--button-primary-text:#FFFFFF;
  --button-secondary-bg:#FFFFFF;--button-secondary-border:#102A43;--button-secondary-text:#102A43;
  --button-danger-bg:#B42318;--button-danger-hover:#921B13;--button-danger-text:#FFFFFF;
  --button-radius:12px;--focus-ring:0 0 0 3px rgba(0,127,122,.25);--transition-fast:150ms ease;
}
.theme-praia{--segment-accent:#00A99D;--segment-accent-light:#DDF5F2;--segment-accent-dark:#007F7A;--segment-background:#F0FAF9;--segment-text:#164C4B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-background);color:var(--color-text-primary);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--color-text-link)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--color-background)}
.pad{padding:20px 16px}
h1,h2,h3,.disp{font-family:var(--font-heading);color:var(--color-text-primary)}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.2}
h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
p{margin:0}
.muted{color:var(--color-text-secondary)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--button-radius);border:1px solid transparent;font:600 16px/1.2 var(--font-body);text-decoration:none;cursor:pointer;background:var(--button-secondary-bg);color:var(--button-secondary-text);white-space:nowrap;transition:background var(--transition-fast),border-color var(--transition-fast),box-shadow var(--transition-fast)}
.btn:focus-visible,.pill:focus-visible,.opt:focus-visible,.gs:focus-visible,.sbtn:focus-visible,.add:focus-visible,.toggle:focus-visible,.nav button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn-block{display:flex;width:100%}
.btn-lg{min-height:56px;font-size:17px;border-radius:var(--radius-lg)}
.btn-primary{background:var(--button-primary-bg);border-color:var(--button-primary-bg);color:var(--button-primary-text)}
.btn-primary:active{background:var(--button-primary-active)}
.btn-secondary{background:var(--button-secondary-bg);border-color:var(--button-secondary-border);color:var(--button-secondary-text)}
.btn-dark{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text-inverse)}
.btn-ghost{background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-primary)}
.btn-sm{min-height:44px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
@media (hover:hover){.btn-primary:hover{background:var(--button-primary-hover)}.btn-secondary:hover,.btn-ghost:hover{background:var(--color-background-soft)}.btn-dark:hover{background:var(--color-primary-hover)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{min-height:44px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-primary);font:500 15px var(--font-body);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text-inverse);font-weight:600}
.opt{min-height:44px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text-primary);font:500 14px var(--font-body);cursor:pointer;white-space:nowrap}
.opt.on{border:2px solid var(--color-secondary-dark);background:var(--color-secondary-light);font-weight:700}
.opt.solid.on{background:var(--color-secondary-dark);color:var(--color-text-inverse)}
.card{border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:16px;background:var(--color-surface)}
.card-strong{border:2px solid var(--color-primary);border-radius:var(--radius-lg);padding:16px;background:var(--color-surface)}
.input{width:100%;min-height:56px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:0 16px;font:400 17px var(--font-body);color:var(--color-text-primary);background:var(--color-surface)}
.input:focus{outline:none;border-color:var(--color-border-focus);box-shadow:var(--focus-ring)}
textarea.input{padding:12px 14px;min-height:84px;font-size:16px;resize:none;line-height:1.4}
.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.foto{width:64px;height:64px;flex:none;border-radius:var(--radius-md);background:var(--color-background-soft);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted)}
.add{width:44px;height:44px;flex:none;border-radius:var(--radius-md);border:none;background:var(--button-primary-bg);color:var(--button-primary-text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.indisp{opacity:.5}
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;white-space:nowrap}
.status-success{color:var(--color-success);background:var(--color-success-bg)}
.status-warning{color:var(--color-warning);background:var(--color-warning-bg)}
.status-danger{color:var(--color-danger);background:var(--color-danger-bg)}
.status-unavailable{color:var(--color-unavailable);background:var(--color-unavailable-bg)}
.status-info{color:var(--color-info);background:var(--color-info-bg)}
.tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--color-secondary-dark);text-transform:uppercase;letter-spacing:.05em}
.loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--color-secondary-dark);font-weight:600}
.gschip{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--color-primary);color:var(--color-text-inverse);padding:9px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:16px}
header.top{padding:14px 16px 12px;border-bottom:1px solid var(--color-border);background:var(--color-surface);position:sticky;top:0;z-index:4}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px 20px;background:var(--color-surface);border-top:1px solid var(--color-border);box-shadow:var(--shadow-md)}
.bottom .inner{max-width:448px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--color-surface);border-top:1px solid var(--color-border);padding:4px 4px 12px}
.nav .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;font:500 12px var(--font-body);color:var(--color-text-secondary);cursor:pointer;position:relative;border-radius:var(--radius-sm)}
.nav button.on{color:var(--color-secondary-dark);font-weight:700}
.nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:999px;background:var(--color-danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.space-nav{height:110px}
.space-bar{height:110px}
.nav.nav4 .inner{grid-template-columns:repeat(4,minmax(0,1fr))}
.bottom.acima{bottom:70px;padding:10px 16px;box-shadow:none}
.space-bar2{height:180px}
.mapa-scroll{overflow-x:auto;padding:4px 2px 8px}
.gsgrid{display:grid;gap:var(--gsgap,10px);width:max-content;margin:0 auto}
.gs{width:var(--gs,48px);height:var(--gs,48px);padding:0;border-radius:999px;border:2px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text-secondary);font:700 var(--gsf,15px) var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.gs.ocupado{background:var(--color-secondary-light);border-color:var(--color-secondary-dark);color:var(--color-text-primary)}
.gs.novo{background:var(--color-warning);border-color:var(--color-warning);color:#fff}
.gs.conta{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.gs.sel{outline:3px solid var(--color-secondary-dark);outline-offset:3px}
.gs{position:relative}
.gs.av{border-radius:12px}
.gs.ex{border-style:dashed}
.gs .alerta{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:999px;background:var(--color-danger);border:2px solid #fff}
.zona-row{display:flex;gap:var(--gsgap,10px);justify-content:center;flex-wrap:wrap}
.zona-col{display:flex;flex-direction:column;gap:var(--gsgap,10px)}
.btn-danger{background:var(--button-danger-bg);border-color:var(--button-danger-bg);color:var(--button-danger-text)}
.btn-outline-danger{background:var(--color-surface);border-color:var(--color-danger);color:var(--color-danger)}
.somalerta{display:flex;width:100%;align-items:center;gap:10px;border:none;border-radius:var(--radius-md);padding:14px;background:var(--color-danger);color:#fff;font:700 15px var(--font-body);text-align:left;cursor:pointer;min-height:56px}
.edped{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.edlin{display:flex;align-items:center;gap:10px}
.edlin .nm{flex:1;min-width:0;font-size:15px}
.edlin.zero .nm{text-decoration:line-through;color:var(--color-text-muted)}
.recusa{border-top:1px solid var(--color-border);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.zona-lbl{font-size:11px;font-weight:700;color:var(--segment-text);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.sw{width:14px;height:14px;border-radius:999px;display:inline-block;flex:none}
.banner{border-radius:var(--radius-md);padding:12px 14px;font-size:14px;line-height:1.45}
.banner.info{background:var(--color-info-bg);color:var(--color-info)}
.banner.soft{background:var(--color-background-soft);color:var(--color-text-primary)}
.banner.ok{background:var(--color-success-bg);color:var(--color-success);font-weight:600}
.banner.warn{background:var(--color-warning-bg);color:var(--color-warning)}
.banner.err{background:var(--color-danger-bg);color:var(--color-danger)}
.qr{display:flex;justify-content:center;align-items:center;padding:12px;background:#fff;border-radius:var(--radius-md);min-height:60px}
.qr img,.qr canvas{display:block}
.line{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.line .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.hr{height:1px;background:var(--color-border)}
.stepper{display:flex;align-items:center;gap:6px}
.sbtn{width:44px;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sbtn.dark{border-color:var(--color-primary);background:var(--color-primary);color:#fff}
.sbtn.teal{border-color:var(--button-primary-bg);background:var(--button-primary-bg);color:#fff}

.qtd{min-width:28px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.sec-t{font-size:13px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:0}
.toggle{width:124px;min-height:44px;border-radius:999px;border:1px solid var(--color-success);background:var(--color-success-bg);color:var(--color-success);font:700 14px var(--font-body);cursor:pointer;flex:none}
.toggle.off{background:var(--color-unavailable-bg);color:var(--color-unavailable);border-color:var(--color-unavailable)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:20;background:var(--color-primary);color:#fff;padding:12px 18px;border-radius:var(--radius-md);font-size:14px;font-weight:600;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg)}
.chamado{display:flex;align-items:center;gap:12px;border-radius:var(--radius-lg);padding:14px 14px 14px 16px}
.chamado.conta{background:var(--color-primary);color:#fff}
.chamado.garcom{background:var(--color-warning-bg);color:var(--color-warning)}
.chamado.parcial{background:var(--color-info-bg);color:var(--color-info)}
.big-total{font-family:var(--font-body);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:none;color:var(--color-text-link);font:600 15px var(--font-body);min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0}
.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(16,42,67,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:480px;background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:24px 16px 28px;box-shadow:var(--shadow-lg)}
.pessoa{border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:8px}
.pessoa.eu{border:2px solid var(--color-secondary-dark)}
.hero{background:var(--color-primary);color:#fff;padding:28px 20px 30px;display:flex;flex-direction:column;gap:18px}
.hero h1{color:#fff}
.flowbar{height:8px;background:var(--color-secondary)}
.foot{padding:20px 16px 28px;text-align:center;font-size:12px;color:var(--color-text-muted)}
</style>

    if (!S.config.pinHash) return h + '<button class="btn btn-secondary btn-lg btn-block" data-a="novaConta">Começar uma nova conta</button></div>';
    if (!S.liberar) return h + '<button class="btn btn-ghost btn-block" data-a="liberarAbrir">Liberar este celular (garçom)</button></div>';
    return h + '<form data-form="pinLiberar" class="card-strong stack g12"><h2 style="font-size:18px">Liberar celular</h2><p class="muted" style="font-size:14px">Só a equipe da barraca. Digite o PIN do dono.</p>' +
      '<div><label class="lbl" for="pin1">PIN</label><input class="input" id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="6" data-bind="pinIn" value="' + esc(S.pinIn) + '"></div>' +
      '<div class="row g8"><button class="btn btn-primary" style="flex:2" type="submit"' + (S.busy ? ' disabled' : '') + '>Liberar</button><button class="btn btn-ghost" style="flex:1" type="button" data-a="liberarSair">Cancelar</button></div></form></div>';
  }

  function navCliente(atual) {
    function b(attrs, label, icon, on) {
      return '<button' + (on ? ' class="on" aria-current="page"' : '') + ' ' + attrs + '>' + icon + label + '</button>';
    }
    return '<nav class="nav nav4" aria-label="Menu do cliente"><div class="inner">' +
      b('data-a="cview" data-v="menu"', 'Cardápio', I.utensils(), atual === 'menu') +
      b('data-a="cview" data-v="conta"', 'Minha conta', I.receipt(), atual === 'conta') +
      b('data-a="chamar" data-t="garcom"', 'Garçom', I.bell(), false) +
      b('data-a="navFechar"', 'Fechar conta', I.check(), false) +
      '</div></nav>';
  }

  function headerCliente(n, sess, extra) {
    return '<header class="top stack g12"><div class="row between g10">' +
      '<div class="stack g4" style="min-width:0"><div class="disp" style="font-weight:800;font-size:19px">' + esc(S.config.nome) + '</div>' +
      '<div class="loc">' + I.pin(16) + ' Guarda-sol ' + pad2(n) + ' · ' + esc(S.meuNome || sess.nome) + '</div></div>' +
      '</div>' + (extra || '') + '</header>';
  }

  function categorias() {
    var cats = ['Tudo'];
    if (S.cardapio.some(function (i) { return i.destaque; })) cats.push('Destaques');
    S.cardapio.forEach(function (i) { var c = i.cat || 'Outros'; if (cats.indexOf(c) < 0) cats.push(c); });
    return cats;
  }

  function itemCliente(i, emDestaques) {
    var indisp = !!i.acabou, ops = Array.isArray(i.opcoes) ? i.opcoes : [], sel = S.opcaoSel[i.id] || ops[0];
    var h = '<div class="stack g8" style="padding:12px 0;border-bottom:1px solid var(--color-border)">' +
      '<div class="row g12"><div class="row g12' + (indisp ? ' indisp' : '') + '" style="flex:1;min-width:0">' +
      '<div class="foto" aria-hidden="true">' + I.img() + '</div>' +
      '<div class="stack" style="gap:2px;min-width:0">' +
      (i.destaque && !emDestaques ? '<span class="tag">Destaque</span>' : '') +
      '<div style="font-weight:600;font-size:16px">' + esc(i.nome) + '</div>' +
      (i.desc ? '<div class="muted" style="font-size:14px">' + esc(i.desc) + '</div>' : '') +
      '<div class="num" style="font-weight:700;font-size:17px;margin-top:2px">' + brl(i.preco) + '</div></div></div>' +
      (indisp ? '<span class="status status-unavailable">Acabou por hoje</span>' : '<button class="add" data-a="add" data-id="' + esc(i.id) + '" aria-label="Adicionar ' + esc(i.nome) + '">' + I.plus() + '</button>') +
      '</div>';
    if (!indisp && ops.length) {
      h += '<div class="chips" role="group" aria-label="Opções de ' + esc(i.nome) + '" style="padding-left:76px">' +
        ops.map(function (o) { return '<button class="opt' + (o === sel ? ' on' : '') + '" aria-pressed="' + (o === sel) + '" data-a="opcao" data-id="' + esc(i.id) + '" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    }
    return h + '</div>';
  }

  function statusChamado(sess) {
    if (sess.chamado === 'garcom') return '<div class="banner warn row g8">' + I.bell(18) + ' Seu chamado foi enviado.</div>';
    var meu = sess.chamadoPid === S.pid;
    if (sess.chamado === 'conta') return '<div class="banner info row g8">' + I.receipt(18) + (meu ? ' Sua solicitação de fechamento foi enviada. Nossa equipe já foi avisada.' : ' ' + esc(sess.chamadoQuem || 'Alguém') + ' pediu o fechamento da conta do guarda-sol.') + '</div>';
    if (sess.chamado === 'parcial') return '<div class="banner info row g8">' + I.receipt(18) + (meu ? ' Sua solicitação foi enviada. A equipe vai fechar a sua parte.' : ' ' + esc(sess.chamadoQuem || 'Alguém') + ' pediu para fechar a própria parte.') + '</div>';
    return '';
  }

  function viewMenu(n, sess) {
    var cats = categorias(), cat = cats.indexOf(S.cat) >= 0 ? S.cat : 'Tudo';
    var chips = '<nav class="chips" aria-label="Categorias">' + cats.map(function (c) {
      return '<button class="pill' + (c === cat ? ' on' : '') + '" data-a="cat" data-c="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</nav>';
    var body = '';
    if (!S.okCard) body = '<p class="muted">Carregando cardápio…</p>';
    else if (!S.cardapio.length) body = '<div class="banner soft">O cardápio ainda está sendo preparado. Chame o garçom para pedir.</div>';
    else {
      var secoes = [];
      if (cat === 'Tudo') {
        var dest = S.cardapio.filter(function (i) { return i.destaque; });
        if (dest.length) secoes.push(['Destaques', dest, true]);
        cats.slice(1).filter(function (c) { return c !== 'Destaques'; }).forEach(function (c) {
          secoes.push([c, S.cardapio.filter(function (i) { return (i.cat || 'Outros') === c; }), false]);
        });
      } else if (cat === 'Destaques') secoes.push(['Destaques', S.cardapio.filter(function (i) { return i.destaque; }), true]);
      else secoes.push([cat, S.cardapio.filter(function (i) { return (i.cat || 'Outros') === cat; }), false]);
      body = secoes.map(function (s) {
        return '<section class="stack"><h2 style="margin-top:12px;font-size:18px">' + esc(s[0]) + '</h2>' + s[1].map(function (i) { return itemCliente(i, s[2]); }).join('') + '</section>';
      }).join('');
    }
    var qtd = S.cart.reduce(function (s, c) { return s + c.qtd; }, 0);
    var tot = S.cart.reduce(function (s, c) { return s + c.qtd * c.preco; }, 0);
    var bar = qtd ? '<div class="bottom acima"><div class="inner"><button class="btn btn-primary btn-lg btn-block" style="justify-content:space-between" data-a="cview" data-v="carrinho">' +
      '<span class="row g10"><span class="num" style="min-width:28px;height:28px;border-radius:999px;background:#fff;color:var(--button-primary-bg);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:0 6px">' + qtd + '</span>Ver meu pedido</span>' +
      '<span class="num">' + brl(tot) + '</span></button></div></div>' : '';
    return '<div class="wrap">' + headerCliente(n, sess, chips) +
      '<main class="stack g8" style="padding:12px 16px 20px">' + banners() + bannersRecusa() + statusChamado(sess) +
      '<div class="stack g4" style="margin-top:4px"><h1 style="font-size:24px">Nosso cardápio</h1><p class="muted" style="font-size:14px">Escolha o que deseja e adicione ao seu pedido.</p></div>' + body + '</main>' +
      rodape() + (qtd ? '<div class="space-bar2"></div>' : '<div class="space-nav"></div>') + bar + navCliente('menu') + '</div>';
  }

  function viewCarrinho(n, sess) {
    var tot = S.cart.reduce(function (s, c) { return s + c.qtd * c.preco; }, 0);
    var linhas = S.cart.map(function (c, idx) {
      return '<div class="row g12" style="padding:14px 0;border-bottom:1px solid var(--color-border)">' +
        '<div class="stack" style="flex:1;min-width:0;gap:3px"><div style="font-weight:600;font-size:17px">' + esc(c.nome) + '</div>' +
        (c.opcao ? '<div class="muted" style="font-size:14px">' + esc(c.opcao) + '</div>' : '') +
        '<div class="num" style="font-weight:700;font-size:15px">' + brl(c.qtd * c.preco) + '</div></div>' +
        '<div class="stepper"><button class="sbtn" data-a="qtd" data-i="' + idx + '" data-d="-1" aria-label="Diminuir ' + esc(c.nome) + '">' + I.minus() + '</button>' +
        '<span class="qtd">' + c.qtd + '</span>' +
        '<button class="sbtn teal" data-a="qtd" data-i="' + idx + '" data-d="1" aria-label="Aumentar ' + esc(c.nome) + '">' + I.plus(18) + '</button></div></div>';
    }).join('');
    return '<div class="wrap">' +
      '<header class="top stack g8"><button class="linkbtn" data-a="cview" data-v="menu">' + I.back() + ' Continuar comprando</button>' +
      '<h1>Meu pedido</h1>' +
      '<div class="banner soft row g8"><span style="color:var(--color-secondary-dark)">' + I.pin(18) + '</span><span>Vai para: <strong>Guarda-sol ' + pad2(n) + ' · ' + esc(S.meuNome || sess.nome) + '</strong></span></div></header>' +
      '<main class="stack g16" style="padding:8px 16px 20px">' + banners() +
      (S.cart.length ? '<div>' + linhas + '</div>' : '<p class="muted" style="padding:16px 0">Seu pedido ainda está vazio. Que tal escolher alguma coisa?</p>') +
      '<div><label class="lbl" for="obs">Observação (opcional)</label><textarea class="input" id="obs" rows="3" data-bind="obs" placeholder="Ex.: sem gelo, trazer canudos" maxlength="200">' + esc(S.obs) + '</textarea></div>' +
      '<div style="height:150px"></div></main>' +
      '<div class="bottom"><div class="inner stack g10">' +
      '<div class="line" style="align-items:baseline"><span class="muted" style="font-size:16px">Total do pedido</span><span class="big-total">' + brl(tot) + '</span></div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-a="enviar"' + (!S.cart.length || S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Enviando…' : 'Finalizar pedido') + '</button>' +
      '<p class="muted" style="font-size:13px;text-align:center">Vai para a sua conta. Você paga no fim, na barraca.</p></div></div></div>';
  }

  function pessoaCard(g, eu, comAcoesDono) {
    var linhas = g.itens.linhas.length ? g.itens.linhas.map(function (l) {
      return '<div class="line"><span>' + l.qtd + '× ' + esc(l.nome) + (l.opcao ? ' · ' + esc(l.opcao) : '') + '</span><span class="v">' + brl(l.valor) + '</span></div>';
    }).join('') : '<p class="muted" style="font-size:14px">Ainda não pediu nada.</p>';
    var st = '';
    if (g.pedidos.length && !g.abertos.length) st = '<span class="status status-success">' + I.check(14) + ' Pago</span>';
    else if (g.pago > 0) st = '<span class="status status-info">Pagou ' + brl(g.pago) + '</span>';
    var acao = '';
    if (comAcoesDono && g.abertos.length) {
      acao = '<button class="btn btn-secondary btn-block" data-a="pagarParte" data-k="' + esc(g.key) + '"' + (S.busy ? ' disabled' : '') + '>' + I.receipt(18) + ' Receber só de ' + esc(g.nome) + ' · ' + brl(comDesconto(g.emAberto)) + (S.descPct ? ' (−' + S.descPct + '%)' : '') + '</button>';
    }
    return '<div class="pessoa' + (eu ? ' eu' : '') + '"><div class="row between g8"><div class="disp" style="font-weight:700;font-size:17px">' + esc(g.nome) + (eu ? ' <span class="muted" style="font-weight:500;font-size:14px">(você)</span>' : '') + '</div>' + st + '</div>' +
      linhas + (g.pedidos.length ? '<div class="hr"></div><div class="line"><strong>Em aberto</strong><strong class="v">' + brl(g.emAberto) + '</strong></div>' : '') + acao + '</div>';
  }

  function viewConta(n, sess) {
    var ps = S.pedidos.filter(function (p) { return p.sid === S.sid; });
    var grupos = porPessoa(sess, ps);
    var meu = grupos.filter(function (g) { return g.pid === S.pid; })[0];
    var outros = grupos.filter(function (g) { return g.pid !== S.pid; });
    var emAberto = grupos.reduce(function (t, g) { return t + g.emAberto; }, 0);
    var pagantes = Math.max(1, S.pagantes || sess.pagantes || 1);
    var h = '<div class="wrap"><header class="top stack g10"><div class="row between g10"><h1>Minha conta</h1>' +
      '<div class="loc">' + I.pin(16) + ' Guarda-sol ' + pad2(n) + '</div></div>';
    if (S.enviado) h += '<div class="banner ok stack g4"><span class="row g8">' + I.check(20) + ' Pedido enviado com sucesso!</span><span style="font-weight:400">Agora é só aguardar. O estabelecimento já recebeu seu pedido ' + esc(S.enviado) + '.</span></div>';
    h += '</header><main class="stack g16" style="padding:14px 16px 20px">' + banners() + bannersRecusa() + statusChamado(sess);
    h += pessoaCard(meu || { key: 'eu', nome: S.meuNome || 'Você', pedidos: [], abertos: [], pagos: [], emAberto: 0, pago: 0, itens: { linhas: [] } }, true, false);
    if (outros.length) h += '<p class="sec-t" style="margin-top:4px">Também neste guarda-sol</p>' + outros.map(function (g) { return pessoaCard(g, false, false); }).join('');
    h += '<section class="card stack g10"><div class="line" style="align-items:baseline"><span style="font-weight:600">Total em aberto do guarda-sol</span><span class="big-total">' + brl(emAberto) + '</span></div>' +
      '<div class="hr"></div><div class="row between g12"><span style="font-size:15px">Dividir entre</span>' +
      '<div class="stepper"><button class="sbtn" data-a="pagantes" data-d="-1" aria-label="Menos uma pessoa">' + I.minus() + '</button><span class="qtd">' + pagantes + '</span>' +
      '<button class="sbtn dark" data-a="pagantes" data-d="1" aria-label="Mais uma pessoa">' + I.plus(18) + '</button></div></div>' +
      '<div class="line" style="align-items:baseline"><span class="muted">Cada pessoa paga</span><span class="big-total" style="color:var(--color-secondary-dark)">' + brl(emAberto / pagantes) + '</span></div></section>' +
      '<button class="linkbtn" style="align-self:center" data-a="cview" data-v="menu">' + I.plus(18) + ' Pedir mais</button>' +
      '<button class="btn btn-primary btn-lg btn-block" data-a="navFechar"' + (emAberto > 0 ? '' : ' disabled') + '>' + I.receipt(20) + ' Fechar a conta</button>' +
      '<p class="muted" style="font-size:13px;text-align:center">Solicitar o fechamento não é o pagamento. A equipe confere e você paga na barraca.</p>' +
      '</main><div class="space-nav"></div>' + navCliente('conta') + '</div>';
    return h;
  }

  function modalFechar() {
    var n = S.route.gs, sess = S.sessoes['gs-' + n]; if (!sess) return '';
    var ps = S.pedidos.filter(function (p) { return p.sid === S.sid; });
    var grupos = porPessoa(sess, ps);
    var meu = grupos.filter(function (g) { return g.pid === S.pid; })[0];
    var emAberto = grupos.reduce(function (t, g) { return t + g.emAberto; }, 0);
    var temOutros = grupos.some(function (g) { return g.pid !== S.pid && g.emAberto > 0; });
    return '<div class="modal-bg" data-a="fecharModal"><div class="modal stack g12" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop="1">' +
      '<h2 id="mt">Deseja solicitar o fechamento da sua conta?</h2>' +
      '<p class="muted" style="font-size:14px">A equipe confere os pedidos e você paga na barraca.</p>' +
      '<button class="btn btn-primary btn-lg btn-block" style="justify-content:space-between" data-a="pedirFechamento" data-t="conta"><span>Sim, fechar o guarda-sol inteiro</span><span class="num">' + brl(emAberto) + '</span></button>' +
      (temOutros && meu && meu.emAberto > 0 ? '<button class="btn btn-secondary btn-lg btn-block" style="justify-content:space-between" data-a="pedirFechamento" data-t="parcial"><span>Só a minha parte</span><span class="num">' + brl(meu.emAberto) + '</span></button>' : '') +
      '<button class="btn btn-ghost btn-block" data-a="fecharModal">Voltar ao cardápio</button></div></div>';
  }

  // ---------- Telas: barraca ----------
  function chamadosAbertos() {
    return Object.keys(S.sessoes).map(function (k) { return S.sessoes[k]; })
      .filter(function (s) { return s.aberta && s.chamado; })
      .sort(function (a, b) { return (a.chamadoEm || 0) - (b.chamadoEm || 0); });
  }
  function pedidosNovos() {
    return S.pedidos.filter(function (p) { return p.status === 'novo'; }).sort(function (a, b) { return (a.criadoEm || 0) - (b.criadoEm || 0); });
  }
  function statusGs(i) {
    var s = S.sessoes['gs-' + i];
    if (!s || !s.aberta) return 'livre';
    if (s.chamado === 'conta' || s.chamado === 'parcial') return 'conta';
    if (s.chamado === 'garcom' || S.pedidos.some(function (p) { return p.sid === s.sid && p.status === 'novo'; })) return 'novo';
    return 'ocupado';
  }
  function headerBarraca(titulo, direita) {
    return '<header class="top row between g12"><div class="stack" style="gap:2px"><div class="row g8">' + logo(14) + '<span class="muted" style="font-size:13px">· ' + esc(S.config.nome) + '</span></div><h1 style="font-size:26px">' + esc(titulo) + '</h1></div>' + (direita || '') + '</header>';
  }
  function navBarraca() {
    var badge = pedidosNovos().length + chamadosAbertos().length;
    function b(t, label, icon) {
      return '<button class="' + (S.tab === t ? 'on' : '') + '" data-a="tab" data-t="' + t + '"' + (S.tab === t ? ' aria-current="page"' : '') + '>' + icon +
        (t === 'pedidos' && badge ? '<span class="dot">' + badge + '</span>' : '') + label + '</button>';
    }
    return '<nav class="nav" aria-label="Menu da barraca"><div class="inner">' +
      b('pedidos', 'Pedidos', I.bag()) + b('mapa', 'Mapa', I.map()) + b('cardapio', 'Cardápio', I.utensils()) + b('relatorio', 'Relatório', I.chart()) + b('qr', 'QR Codes', I.qr()) +
      '</div></nav>';
  }
  function viewBarraca() {
    if (S.fecharGs != null) return viewFechar();
    var c = S.tab === 'mapa' ? tabMapa() : S.tab === 'cardapio' ? tabCardapio() : S.tab === 'qr' ? tabQr() : S.tab === 'relatorio' ? tabRelatorio() : tabPedidos();
    var av = avisoSom();
    if (av) c = c.replace('</header>', '</header><div style="padding:12px 16px 0">' + av + '</div>');
    return '<div class="wrap">' + c + '<div class="space-nav"></div>' + navBarraca() + '</div>';
  }

  function tabPedidos() {
    var som = S.somAtivo ? '<button class="status status-success" style="border:none;cursor:pointer;min-height:36px" data-a="som" aria-label="Som ligado. Tocar para testar.">' + I.sound(16) + ' Som ligado · testar</button>'
      : '<span class="status status-danger">' + I.sound(16) + ' Som desligado</span>';
    var ch = chamadosAbertos(), nv = pedidosNovos();
    var h = headerBarraca('Pedidos', som) + '<main class="stack g20" style="padding:16px">' + banners();
    if (loading()) h += '<p class="muted">Conectando…</p>';
    if (ch.length) {
      h += '<section class="stack g10"><h2 class="sec-t">Chamados (' + ch.length + ')</h2>' + ch.map(function (s) {
        if (s.chamado === 'conta') {
          return '<div class="chamado conta"><span style="flex:none">' + I.receipt(24) + '</span><div class="stack" style="flex:1;min-width:0;gap:2px">' +
            '<div style="font-weight:700">' + esc(nomeGs(s.gs)) + ' · ' + esc(s.chamadoQuem || s.nome) + '</div><div style="font-size:14px;color:#DDF5F2">Quer fechar a conta · ' + minAgo(s.chamadoEm) + '</div>' + (descGs(s.gs) ? '<div style="font-size:13px;color:#DDF5F2">' + esc(descGs(s.gs)) + '</div>' : '') + '</div>' +
            '<button class="btn btn-sm" style="background:#fff;color:var(--color-primary);flex:none" data-a="abrirFechar" data-gs="' + s.gs + '">Fechar conta</button></div>';
        }
        if (s.chamado === 'parcial') {
          return '<div class="chamado parcial"><span style="flex:none">' + I.users(24) + '</span><div class="stack" style="flex:1;min-width:0;gap:2px">' +
            '<div style="font-weight:700">' + esc(nomeGs(s.gs)) + ' · ' + esc(s.chamadoQuem || '') + '</div><div style="font-size:14px">Quer fechar só a própria parte · ' + minAgo(s.chamadoEm) + '</div>' + (descGs(s.gs) ? '<div style="font-size:13px">' + esc(descGs(s.gs)) + '</div>' : '') + '</div>' +
            '<button class="btn btn-secondary btn-sm" style="flex:none" data-a="abrirFechar" data-gs="' + s.gs + '">Ver parte</button></div>';
        }
        return '<div class="chamado garcom"><span style="flex:none">' + I.bell(24) + '</span><div class="stack" style="flex:1;min-width:0;gap:2px">' +
          '<div style="font-weight:700">' + esc(nomeGs(s.gs)) + ' · ' + esc(s.chamadoQuem || s.nome) + '</div><div style="font-size:14px">Chamou o garçom · ' + minAgo(s.chamadoEm) + '</div>' + (descGs(s.gs) ? '<div style="font-size:13px">' + esc(descGs(s.gs)) + '</div>' : '') + '</div>' +
          '<button class="btn btn-secondary btn-sm" style="flex:none" data-a="atender" data-gs="' + s.gs + '">Indo!</button></div>';
      }).join('') + '</section>';
    }
    h += '<section class="stack g12"><h2 class="sec-t">Novos pedidos (' + nv.length + ')</h2>';
    if (!nv.length && !loading()) h += '<div class="banner soft">Nenhum pedido novo. Você será avisado com som e vibração quando chegar um. Deixe o volume do celular alto e esta tela aberta.</div>';
    h += nv.map(function (p) {

  // Recusa total ou parcial de um pedido novo (acabou, não está gelado, outro motivo)

  var PRESETS = [[2, 4], [2, 8], [3, 10], [3, 8], [4, 5], [5, 6], [2, 10]];
  // Tamanho dos botões do mapa para caber na largura da tela, sem arrastar para os lados
  function tamanhoGs(C, lados) {

  function inicioPeriodo(p) { var d = new Date(); d.setHours(0, 0, 0, 0); if (p === '7d') d.setDate(d.getDate() - 6); return d.getTime(); }

  function tabRelatorio() {
    var ini = inicioPeriodo(S.relPeriodo);
    // Venda só conta quando o dono confirma o pagamento no fechamento (parcial ou total)
    var fs = S.fechamentos.filter(function (f) { return (f.em || 0) >= ini; });
    var ps = S.pedidos.filter(function (p) { return (p.criadoEm || 0) >= ini; });
    var vendas = fs.reduce(function (t, f) { return t + (Number(f.total) || 0); }, 0);
    var descontos = fs.reduce(function (t, f) { return t + (Number(f.desconto) || 0); }, 0);
    var contas = {}; fs.forEach(function (f) { if (f.tipo !== 'parcial') contas[f.sid || f.id] = true; });
    var porConta = {}; fs.forEach(function (f) { var k = f.sid || f.id; if (contas[k]) porConta[k] = (porConta[k] || 0) + (Number(f.total) || 0); });
    var nContas = Object.keys(contas).length;
    var media = nContas ? Object.keys(porConta).reduce(function (t, k) { return t + porConta[k]; }, 0) / nContas : null;
    var parciais = fs.filter(function (f) { return f.tipo === 'parcial'; }).length;
    var qtd = {}, nItens = 0;
    fs.forEach(function (f) { (f.itens || []).forEach(function (it) { var q = Number(it.qtd) || 0; qtd[it.nome] = (qtd[it.nome] || 0) + q; nItens += q; }); });
    var top = Object.keys(qtd).map(function (k) { return [k, qtd[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
    var max = top.length ? top[0][1] : 1;
    var horas = {}, pico = null;
    ps.forEach(function (p) { var h = new Date(p.criadoEm).getHours(); horas[h] = (horas[h] || 0) + 1; });
    Object.keys(horas).forEach(function (h) { if (pico === null || horas[h] > horas[pico]) pico = h; });
    var pg = {}; fs.forEach(function (f) { var k = f.pagamento || 'Outro'; pg[k] = (pg[k] || 0) + (Number(f.total) || 0); });
    var abertoPs = S.pedidos.filter(function (p) { var x = S.sessoes['gs-' + p.gs]; return !p.pago && x && x.aberta && x.sid === p.sid; });
    var emAberto = somaPedidos(abertoPs), contasAbertas = {}; abertoPs.forEach(function (p) { contasAbertas[p.sid] = true; });
    var nAbertas = Object.keys(contasAbertas).length;
    var recusados = S.todosPedidos.filter(function (p) { return p.recusa && (p.recusa.em || 0) >= ini; }).length;
    var cancelados = S.todosPedidos.filter(function (p) { return p.status === 'cancelado' && !p.recusa && (p.canceladoEm || 0) >= ini; }).length;
    var hoje = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
    function tile(rot, val, sub) {
      return '<div class="card stack g4" style="padding:14px"><span class="muted" style="font-size:13px">' + rot + '</span>' +
        '<span class="big-total">' + val + '</span>' + (sub ? '<span class="muted" style="font-size:12px">' + sub + '</span>' : '') + '</div>';
    }
    var h = headerBarraca('Relatório', '<span class="muted" style="font-size:13px">' + esc(hoje) + '</span>') + '<main class="stack g20" style="padding:16px">' + banners() +
      '<div class="row g4" role="group" aria-label="Período" style="background:var(--color-background-soft);border-radius:var(--radius-md);padding:4px">' +
      [['hoje', 'Hoje'], ['7d', 'Últimos 7 dias']].map(function (o) {
        var on = S.relPeriodo === o[0];
        return '<button class="btn" style="flex:1;min-height:44px;border:none;' + (on ? 'background:var(--color-primary);color:#fff' : 'background:transparent;font-weight:500') + '" aria-pressed="' + on + '" data-a="relPeriodo" data-p="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div>';
    if (!S.okPed || !S.okFech) return h + '<p class="muted">Carregando…</p></main>';
    if (!ps.length && !fs.length) return h + '<div class="banner soft">Ainda não há pedidos neste período. Os números aparecem aqui assim que os clientes começarem a pedir.</div></main>';
    h += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">' +
      tile('Vendas', brl(vendas), 'pagamentos confirmados') + tile('Contas fechadas', nContas, parciais ? parciais + ' pagamento' + (parciais > 1 ? 's' : '') + ' parcia' + (parciais > 1 ? 'is' : 'l') : '') +
      tile('Média por conta', media === null ? '—' : brl(media), '') + tile('Itens vendidos', nItens, ps.length + (ps.length === 1 ? ' pedido feito' : ' pedidos feitos')) + '</div>';
    if (descontos > 0) h += '<div class="line" style="font-size:14px"><span class="muted">Descontos dados</span><strong class="v">' + brl(descontos) + '</strong></div>';
    if (nAbertas) h += '<div class="banner info">Em aberto agora: <strong class="num">' + brl(emAberto) + '</strong> em ' + nAbertas + ' conta' + (nAbertas > 1 ? 's' : '') + '. Entra nas vendas quando o pagamento for confirmado no fechamento.</div>';
    if (top.length) h += '<section class="stack g12"><h2>Mais vendidos</h2>' + top.map(function (t) {
      return '<div class="stack g6"><div class="line" style="font-size:14px"><span>' + esc(t[0]) + '</span><strong class="v">' + t[1] + '</strong></div>' +
        '<div aria-hidden="true" style="height:10px;border-radius:999px;background:var(--color-surface-active)"><div style="width:' + Math.max(4, Math.round(t[1] / max * 100)) + '%;height:10px;border-radius:999px;background:var(--color-secondary-dark)"></div></div></div>';
    }).join('') + '</section>';
    if (Object.keys(pg).length) h += '<section class="card stack g10"><h2 style="font-size:17px">Como os clientes pagaram</h2>' + Object.keys(pg).map(function (k) {
      return '<div class="line"><span>' + esc(k) + '</span><strong class="v">' + brl(pg[k]) + '</strong></div>';
    }).join('') + '</section>';
    if (pico !== null) h += '<div class="row between g12" style="background:var(--color-background-soft);border-radius:var(--radius-md);padding:14px 16px"><span class="muted row g6">' + I.clock(18) + ' Horário de pico de pedidos</span><strong class="num">' + pico + 'h – ' + (Number(pico) + 1) + 'h</strong></div>';
    if (recusados || cancelados) h += '<p class="muted" style="font-size:13px">' + [recusados ? recusados + ' pedido' + (recusados > 1 ? 's' : '') + ' com recusa' : '', cancelados ? cancelados + ' cancelado' + (cancelados > 1 ? 's' : '') + ' no fechamento' : ''].filter(Boolean).join(' · ') + '. Não entram nas vendas.</p>';
    return h + '</main>';
  }

      '<section class="card stack g10"><div class="row between g8"><span class="lbl" style="margin:0">PIN do dono</span>' + (S.config.pinHash ? '<span class="status status-success">' + I.check(14) + ' Criado</span>' : '<span class="status status-warning">Ainda não criado</span>') + '</div>' +

        : '<button class="btn btn-secondary" data-a="pinTrocaAbrir">' + (S.config.pinHash ? 'Trocar PIN' : 'Criar PIN') + '</button>') + '</section>' +
      '<p class="muted" style="font-size:14px">São ' + POOL + ' plaquinhas fixas, que nunca mudam. As de 01 a ' + pad2(N()) + ' vão nos guarda-sóis do formato. As demais servem para avulsos e guarda-sóis extras, seguindo a sequência.</p>' +

  function qtdsDraft(p) { return S.draft[p.id] || (p.itens || []).map(function (it) { return Number(it.qtd) || 0; }); }
  function secaoEditar(ps) {
    var abertos = ps.filter(function (p) { return !p.pago; }).sort(function (a, b) { return (a.criadoEm || 0) - (b.criadoEm || 0); });
    if (!abertos.length) return '';
    if (!S.editConta) return '<button class="btn btn-ghost btn-block" data-a="editAbrir">Editar ou cancelar pedidos (PIN)</button>';
    var h = '<section class="card-strong stack g12">';
    if (!pinValido()) return h + formPin('editSair', 'Para editar ou cancelar pedidos desta conta.') + '</section>';
    h += '<div class="row between g8"><h2 style="font-size:18px">Editar pedidos em aberto</h2><button class="linkbtn" data-a="editSair">Concluir</button></div>' +
      '<p class="muted" style="font-size:13px">Use − e + para mudar quantidades e toque em Salvar. Pedidos já pagos não aparecem aqui.</p>';
    h += abertos.map(function (p) {
      var q = qtdsDraft(p), orig = (p.itens || []).map(function (it) { return Number(it.qtd) || 0; });
      var mudou = q.some(function (x, i) { return x !== orig[i]; });
      var total = (p.itens || []).reduce(function (t, it, i) { return t + q[i] * (Number(it.preco) || 0); }, 0);
      var conf = S.confirmCancel === p.id;
      return '<div class="edped"><div class="row between g8"><strong style="font-size:15px">' + esc(p.quem || p.nome) + '</strong><span class="muted num" style="font-size:12px">' + codigo(p.id) + ' · ' + hora(p.criadoEm) + (p.status === 'entregue' ? ' · entregue' : ' · a entregar') + '</span></div>' +
        (p.itens || []).map(function (it, i) {
          return '<div class="edlin' + (q[i] === 0 ? ' zero' : '') + '"><span class="nm">' + esc(it.nome) + (it.opcao ? ' · ' + esc(it.opcao) : '') + '<br><span class="muted num" style="font-size:13px">' + brl(it.preco) + ' cada</span></span>' +
            '<div class="stepper"><button class="sbtn" data-a="edQtd" data-id="' + esc(p.id) + '" data-i="' + i + '" data-d="-1" aria-label="Menos ' + esc(it.nome) + '"' + (q[i] === 0 ? ' disabled' : '') + '>' + I.minus() + '</button><span class="qtd">' + q[i] + '</span>' +
            '<button class="sbtn" data-a="edQtd" data-id="' + esc(p.id) + '" data-i="' + i + '" data-d="1" aria-label="Mais ' + esc(it.nome) + '">' + I.plus(18) + '</button></div></div>';

        '<div class="line"><span class="muted">Total do pedido</span><strong class="v">' + brl(total) + '</strong></div>' +
        (mudou ? '<div class="row g8"><button class="btn btn-primary btn-sm" style="flex:2" data-a="edSalvar" data-id="' + esc(p.id) + '"' + (S.busy ? ' disabled' : '') + '>' + (total > 0 ? 'Salvar alterações' : 'Salvar (cancela o pedido)') + '</button><button class="btn btn-ghost btn-sm" style="flex:1" data-a="edDesfazer" data-id="' + esc(p.id) + '">Desfazer</button></div>' : '') +
        '<button class="btn btn-sm ' + (conf ? 'btn-danger' : 'btn-outline-danger') + '" data-a="edCancelar" data-id="' + esc(p.id) + '"' + (S.busy ? ' disabled' : '') + '>' + (conf ? 'Confirmar: cancelar pedido inteiro' : 'Cancelar pedido inteiro') + '</button></div>';
    }).join('');
    return h + '</section>';

  function secaoDesconto() {
    if (!S.descEdit) return '<button class="btn btn-ghost btn-block" data-a="descAbrir">' + (S.descPct ? 'Mudar desconto (' + S.descPct + '%)' : 'Dar desconto (PIN)') + '</button>';

      '<p class="muted" style="font-size:13px">Vale para o que for recebido agora, na conta inteira ou só na parte de uma pessoa.</p>' +

  function viewFechar() {

  // ---------- Render ----------
  function view() {
    if (S.route.v === 'barraca') return viewBarraca();
    if (S.route.v === 'cliente') return viewCliente();
    return viewInicio();
  }
  function render() {
    var a = document.activeElement, fid = null, s0 = null, s1 = null;
    if (a && a.id && app.contains(a)) { fid = a.id; try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) {} }
    var sy = window.scrollY;
    app.innerHTML = view();
    modalSlot.innerHTML = (S.modal === 'fechar' && S.route.v === 'cliente') ? modalFechar() : '';
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} } }
    if (S.top) { window.scrollTo(0, 0); S.top = false; } else window.scrollTo(0, sy);
    drawQrs();
  }
  function drawQrs() {
    var els = app.querySelectorAll('[data-qr]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i], txt = el.getAttribute('data-qr'), size = parseInt(el.getAttribute('data-size'), 10) || 170;
      if (typeof QRCode === 'undefined') { el.innerHTML = '<span class="muted" style="font-size:13px">Não foi possível desenhar o QR Code.</span>'; continue; }
      try { new QRCode(el, { text: txt, width: size, height: size, colorDark: '#102A43', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H }); } catch (e) {}
      el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'QR Code: ' + txt);
    }
  }
  function isTyping() { var a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); }

  // ---------- Ações ----------

        if (conflito.length) { toast('As plaquinhas ' + conflito.map(pad2).join(', ') + ' estão em uso como avulso/extra. Tire-as do mapa antes de aumentar o formato.'); return; }
        S.busy = true; render();
        w(function () { return S.db.doc('config/barraca').set({ nome: S.config.nome, linhas: nf.l, colunas: nf.c, guardasois: nf.l * nf.c }, { merge: true }); })
          .then(function (ok) { S.busy = false; if (ok) { S.fmt = null; toast('Formato salvo: ' + nf.l + ' × ' + nf.c + ' = ' + nf.l * nf.c + ' guarda-sóis.'); } render(); });
        return;
      }
      case 'salvarNome': {
        var nm = (S.cfgNome == null ? S.config.nome : S.cfgNome).trim(); if (!nm) { toast('Digite o nome da barraca.'); return; }
        var cfg = { nome: nm, linhas: S.config.linhas, colunas: S.config.colunas, guardasois: N() };
        w(function () { return S.db.doc('config/barraca').set(cfg, { merge: true }); }).then(function (ok) { if (ok) { S.cfgNome = null; toast('Nome salvo.'); render(); } });
        return;
      }
      case 'novoToggle': S.showNovo = !S.showNovo; S.ni = { nome: '', preco: '', cat: '', desc: '', opcoes: '', destaque: false }; render(); return;
      case 'editItem': {
        var ei = S.cardapio.filter(function (x) { return x.id === d.id; })[0]; if (!ei) return;
        S.ni = { id: ei.id, nome: ei.nome || '', preco: (Number(ei.preco) || 0).toFixed(2).replace('.', ','), cat: ei.cat || '', desc: ei.desc || '', opcoes: (ei.opcoes || []).join(', '), destaque: !!ei.destaque };
        S.showNovo = true; S.confirmDel = null; S.top = true; render(); return;
      }
      case 'salvarItem': {
        var ni = S.ni, nomeI = (ni.nome || '').trim(), preco = parsePreco(ni.preco);
        if (!nomeI) { toast('Digite o nome do item.'); return; }
        if (!(preco >= 0)) { toast('Digite um preço válido, ex.: 22,00'); return; }
        var opcoes = (ni.opcoes || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
        var doc = { nome: nomeI, preco: preco, cat: (ni.cat || '').trim() || 'Outros', desc: (ni.desc || '').trim(), opcoes: opcoes, destaque: !!ni.destaque };
        var editId = ni.id;
        if (!editId) { doc.acabou = false; doc.ordem = Date.now(); }
        S.busy = true; render();
        w(function () { return editId ? S.db.doc('cardapio/' + editId).update(doc) : S.db.collection('cardapio').add(doc); })
          .then(function (ok) { S.busy = false; if (ok) { S.ni = { nome: '', preco: '', cat: '', desc: '', opcoes: '', destaque: false }; S.showNovo = false; toast(editId ? 'Item atualizado.' : 'Item salvo.'); } render(); });
        return;
      }
      case 'seed': {
        if (S.busy || S.cardapio.length) return;
        var ex2 = [
          ['balde', 'Balde com 5 cervejas', 45, 'Combos', 'Lata 350 ml, bem gelada', [], true],
          ['cerveja', 'Cerveja lata 350 ml', 10, 'Bebidas', 'Bem gelada', [], false],
          ['coco', 'Água de coco', 8, 'Bebidas', 'Direto do coco', [], false],
          ['refri', 'Refrigerante lata', 7, 'Bebidas', '350 ml', ['Cola', 'Guaraná'], false],
          ['agua', 'Água mineral 500 ml', 5, 'Bebidas', '', ['Sem gás', 'Com gás'], false],
          ['caipi', 'Caipirinha', 22, 'Drinks', 'Escolha a fruta', ['Limão', 'Maracujá', 'Morango'], true],
          ['batata', 'Porção de batata frita', 35, 'Porções', 'Serve 2 a 3 pessoas', [], false],
          ['isca', 'Isca de peixe', 55, 'Porções', 'Com molho tártaro', [], false]
        ];
        S.busy = true; render();
        w(function () { return emSerie(ex2.map(function (x, k) { return [x, k]; }), function (p) { var x = p[0]; return S.db.doc('cardapio/' + x[0]).set({ nome: x[1], preco: x[2], cat: x[3], desc: x[4], opcoes: x[5], destaque: x[6], acabou: false, ordem: p[1] + 1 }); }); })
          .then(function (ok) { S.busy = false; if (ok) toast('Cardápio de exemplo carregado.'); render(); });
        return;
      }
      case 'acabou': { var item = S.cardapio.filter(function (x) { return x.id === d.id; })[0]; if (!item) return; w(function () { return S.db.doc('cardapio/' + d.id).update({ acabou: !item.acabou }); }); return; }
      case 'del': {
        if (S.confirmDel !== d.id) { S.confirmDel = d.id; render(); return; }
        S.confirmDel = null; w(function () { return S.db.doc('cardapio/' + d.id).delete(); }).then(function (ok) { if (ok) toast('Item removido.'); });
        return;
      }
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    if (!app.contains(el) && !modalSlot.contains(el)) return;
    if (el.classList.contains('modal-bg') && e.target.closest('[data-stop]')) return;
    e.preventDefault();
    var dd = {}; for (var k in el.dataset) dd[k] = el.dataset[k];
    if (el.getAttribute('data-a') === 'fecharModal') dd.from = 'conta';
    if (el.getAttribute('data-a') === 'fecharModal' && el.classList.contains('btn')) dd.from = 'botao';
    act(el.getAttribute('data-a'), dd);
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); var f = e.target.getAttribute('data-form'); if (f) act(f, {}); });
  document.addEventListener('input', function (e) { var b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) setPath(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); });
  document.addEventListener('change', function (e) { var b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b && e.target.type === 'checkbox') setPath(b, e.target.checked); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });
  window.addEventListener('hashchange', function () { applyRoute(); render(); });
  setInterval(function () { if (S.route.v === 'barraca' && !isTyping()) render(); }, 30000);
  var rsT = null;
  window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(function () { if (S.route.v === 'barraca' && S.tab === 'mapa' && !isTyping()) render(); }, 200); });

  // ---------- Conexão ----------
  function checkLoaded() { if (!loading()) { clearTimeout(slowTimer); S.slow = false; } }
  var slowTimer = setTimeout(function () { if (loading()) { S.slow = true; render(); } }, 10000);
  function onErr(e) { S.erro = (e && e.code) || 'erro'; clearTimeout(slowTimer); render(); }

  function start(db) {
    S.db = db;
    db.collection('cardapio').onSnapshot(function (snap) {
      S.cardapio = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
      S.okCard = true; checkLoaded(); render();
    }, onErr);
    db.collection('sessoes').onSnapshot(function (snap) {
      var m = {}, avisar = false;
      snap.docs.forEach(function (d) {
        var x = d.data(); m[d.id] = x; var antes = S.sessoes[d.id];
        if (S.okSess && x.aberta && x.chamado && (!antes || antes.chamado !== x.chamado || antes.chamadoEm !== x.chamadoEm)) avisar = true;
      });
      S.sessoes = m; S.okSess = true;
      if (avisar && S.route.v === 'barraca') beep();
      checkLoaded(); render();
    }, onErr);
    db.collection('extras').onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x && x.gs) m[x.gs] = x; }); S.extras = m; render();
    }, function () {});
    db.collection('fechamentos').where('em', '>=', inicioPeriodo('7d')).orderBy('em', 'desc').limit(1000).onSnapshot(function (snap) {
      S.fechamentos = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); S.okFech = true; render();
    }, function () { S.okFech = true; render(); });
    db.collection('pedidos').orderBy('criadoEm', 'desc').limit(1000).onSnapshot(function (snap) {
      if (S.okPed && S.route.v === 'barraca' && snap.docChanges().some(function (c) { return c.type === 'added' && c.doc.data().status === 'novo'; })) beep();
      S.todosPedidos = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      // cancelados e recusados por inteiro não entram em conta, mapa nem relatório
      S.pedidos = S.todosPedidos.filter(function (p) { return p.status !== 'cancelado'; });
      if (S.route.v === 'cliente') {
        var ks = avisosRecusa().map(chaveRecusa), novo = S.rcVistos && ks.some(function (k) { return S.rcVistos.indexOf(k) < 0; });
        S.rcVistos = ks;
        if (novo) { try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {} toast('A barraca deixou um recado sobre o seu pedido.'); }
      }
      S.okPed = true; checkLoaded(); render();
    }, onErr);
    db.doc('config/barraca').onSnapshot(function (d) {
      if (d.exists) {
        var x = d.data(), L = x.linhas, C = x.colunas;
        if (!L || !C) { var tot = Math.max(1, Math.min(MAX_GS, x.guardasois || 12)); C = Math.min(tot, 4); L = Math.ceil(tot / C); }
        while (L * C > MAX_GS) L--;
        S.config = { nome: x.nome || 'Barraca', linhas: L, colunas: C, pinHash: x.pinHash || null };
      }
      S.okCfg = true; checkLoaded(); render();
    }, onErr);
  }

  applyRoute(); render();
  try {
    if (typeof firebase === 'undefined') throw new Error('sdk');
    firebase.initializeApp(FIREBASE_CONFIG);
    var fdb = firebase.firestore(), P = 'barracas/' + BARRACA + '/';
    start({ doc: function (p) { return fdb.doc(P + p); }, collection: function (p) { return fdb.collection(P + p); } });
  } catch (e) { S.semDb = true; clearTimeout(slowTimer); render(); }
})();
</script>
</body>
</html>
